services:
  - type: web
    name: fancy-restaurant
    runtime: python
    buildCommand: uv sync --frozen && uv run python manage.py collectstatic --noinput
    preDeployCommand: uv run python manage.py migrate
    startCommand: uv run waitress-serve --host=0.0.0.0 --port=$PORT FancyRestaurant.wsgi:application
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: fancy-restaurant-db
          property: connectionString

databases:
  - name: fancy-restaurant-db
    plan: free
    databaseName: fancy_restaurant
    user: fancy_restaurant
