[project]
name = "fancy-restaurant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "dj-database-url>=3.1.2",
    "django>=5.2.16",
    "django-htmx>=1.28.0",
    "psycopg[binary]>=3.3.4",
    "waitress>=3.0.2",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "coverage>=7.15.0",
    "pylint>=4.0.6",
    "pylint-django>=2.8.0",
    "pytest>=9.1.1",
    "pytest-django>=4.12.0",
]

[tool.black]
target-version = ["py310"]
