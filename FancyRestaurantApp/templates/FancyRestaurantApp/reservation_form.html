{% extends "FancyRestaurantApp/base.html" %}

{% block title %}New Reservation{% endblock %}

{% block content %}
    <h2>Reservation Form</h2>
    <form method="post" action="{% url 'reservation-form' %}">
        {% csrf_token %}
        {{ form.non_field_errors }}
        {{ form.as_p }}
        <button type="submit">Reserve</button>
    </form>
{% endblock %}
