{% extends "FancyRestaurantApp/base.html" %}

{% block title %}{{ heading }}{% endblock %}

{% block content %}

    <form method="post">
        {% csrf_token %}
        {{ form.non_field_errors }}
        {{ form.as_p }}
        <button type="submit">{{ heading }}</button>
    </form>
{% endblock %}
