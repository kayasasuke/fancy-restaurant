<!doctype html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Fancy Restaurant Reservations{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'FancyRestaurantApp/style.css' %}">
    <script src="{% static 'FancyRestaurantApp/htmx.min.js' %}" defer></script>
</head>
<body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
    <header>
        <h1><a href="{% url 'home' %}">Fancy Restaurant Reservations</a></h1>
        <nav aria-label="Main navigation">
            <a href="{% url 'table-list' %}">Tables</a>
            <a href="{% url 'time-slot-list' %}">Time slots</a>
            <a href="{% url 'reservation-form' %}">New reservation</a>
        </nav>
    </header>
    <main class="content">
        {% block content %}{% endblock %}
    </main>
    <footer>
        <small>Fancy Restaurant Reservation System</small>
    </footer>
</body>
</html>
